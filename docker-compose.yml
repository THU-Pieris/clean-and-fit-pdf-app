services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # 不对外映射端口：前端 nginx 通过 compose 内部网络访问 backend:8000
    volumes:
      - backend_data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8091:8080"  # 只监听本机，由 Cloudflare Tunnel 对外提供

volumes:
  backend_data:
